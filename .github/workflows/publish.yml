name: Publish

# Tag a commit nuget-vX.Y.Z to release every NuGet package at the version in Directory.Build.props.
# Editor releases use plain vX tags and are handled by release.yml.
# Publishes via NuGet Trusted Publishing (OIDC) - no API key secret needed.
on:
  push:
    tags: [ 'nuget-v*' ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      # Releases leave out every sample project and the test projects CI cannot run: Graphite needs a GPU,
      # Clay needs model assets that are not committed and Slang needs native binaries fetched after the tests.
      # Prowl.Runtime joins the libraries so it is built and packed with them.
      - name: Trim solution
        working-directory: Anthology
        run: |
          cp Anthology.slnx Publish.slnx
          excluded=$(dotnet sln Publish.slnx list | tr '\\' '/' | grep -Ei '^Graphite/Tests/|^Clay/Tests/|^Slang/Tests/|(^|/)Samples?/|Sample[^/]*\.csproj$')
          echo "Leaving out:"
          echo "$excluded"
          dotnet sln Publish.slnx remove $excluded
          dotnet sln Publish.slnx add ../Prowl.Runtime/Prowl.Runtime.csproj

      - name: Restore
        run: dotnet restore Anthology/Publish.slnx

      - name: Build
        run: dotnet build Anthology/Publish.slnx -c Release --no-restore

      # Runs from Anthology so its global.json selects the test runner the library tests are built for.
      # One assembly at a time, because the networking tests time out when every suite competes for the machine.
      - name: Test
        working-directory: Anthology
        run: dotnet test --solution Publish.slnx -c Release --no-build --max-parallel-test-modules 1

      # Slang's native binaries are not committed; fetch them so they pack into runtimes/.
      - name: Fetch Slang native binaries
        working-directory: Anthology/Slang/Native
        run: dotnet run UpdateSources.cs

      - name: Pack
        run: dotnet pack Anthology/Publish.slnx -c Release --no-build -o artifacts/nuget

      - name: NuGet auth (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: Wulferis

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
